# Which subreddits and feeds to poll. HN and GitHub don't need a list here —
# they're queried by search/trending, not by a fixed set of destinations.
#
# `kind` (community | news) is metadata only now — every source feeds the
# trend radar the same way regardless of kind. See README § "No more
# Digest — everything feeds the trend radar".
#
# To propose a new source: add it here and open a PR.

reddit: # always kind: community
  - LocalLLaMA
  - ClaudeAI
  - OpenAI
  - ChatGPT
  - singularity
  - MachineLearning
  - artificial
  - programming
  - devops
  - webdev
  - AI_Agents

# Fixed list of accounts to track (not search) — always kind: community.
# Pay-per-use: 5 posts/account/day (API floor) + one batched username lookup
# per run. Split across x_rotation_groups days (registry.ts) instead of
# polling all 20 daily — one account doesn't post enough for daily reads to
# be worth it. With 2 groups: 10 accounts/day x 5 = 50 reads/day (~$7.50/mo),
# each account checked every other day.
x_rotation_groups: 2
x_accounts:
  - simonw
  - mitchellh
  - antirez
  - steipete
  - GergelyOrosz
  - ThePrimeagen
  - karpathy
  - levelsio
  - mckaywrigley
  - nutlope
  - rauchg
  - amasad
  - tobi
  - hamelhusain
  - jxnlco
  - eugeneyan
  - sh_reya
  - goodside
  - emollick
  - danshipper

# Technical/community blogs — same kind as HN/Reddit/GitHub, feeds trends.
rss_community:
  - name: "Simon Willison's Blog"
    url: "https://simonwillison.net/atom/everything/"
  - name: "GitHub Blog"
    url: "https://github.blog/feed/"
  # Medium tag feeds (no auth needed, RssConnector handles these like any
  # other feed). Picked the narrow dev-jargon tags, not the broad
  # "artificial-intelligence"/"machine-learning" ones — those are dominated
  # by generic explainer/listicle content that would just be noise against
  # the taxonomy's specific aliases (same reasoning as taxonomy.yaml's
  # "press phrasing" note).
  - name: "Medium: LLM"
    url: "https://medium.com/feed/tag/llm"
  - name: "Medium: AI Agents"
    url: "https://medium.com/feed/tag/ai-agents"
  - name: "Medium: Large Language Models"
    url: "https://medium.com/feed/tag/large-language-models"
  # TODO: verify current feed URLs before enabling —
  # - name: "Anthropic Blog"
  #   url: "https://www.anthropic.com/rss.xml"
  # - name: "Hugging Face Blog"
  #   url: "https://huggingface.co/blog/feed.xml"
  # - name: "Latent Space"
  #   url: "https://www.latent.space/feed"

# Press/journalism — feeds the trend radar same as everything else now.
# These are general-tech feeds (not AI-only) because the taxonomy match step
# already filters down to what's AI-relevant — no need to find an
# AI-specific feed per outlet. Verify each URL before enabling; not
# re-checked today.
rss_news:
  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
  - name: "Wired"
    url: "https://www.wired.com/feed/rss"
  - name: "Ars Technica"
    url: "https://arstechnica.com/feed/"
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
