# Which subreddits and feeds to poll. HN and GitHub don't need a list here —
# they're queried by search/trending, not by a fixed set of destinations.
#
# `kind` splits where each source's posts end up:
#   community -> feeds the trend radar (mention counts)
#   news      -> feeds the digest (daily story synthesis)
# See README § Trends vs digest sourcing.
#
# To propose a new source: add it here and open a PR.

reddit: # always kind: community
  - LocalLLaMA
  - ClaudeAI
  - OpenAI
  - ChatGPT
  - singularity
  - MachineLearning
  - artificial
  - programming
  - devops
  - webdev
  - AI_Agents

# Technical/community blogs — same kind as HN/Reddit/GitHub, feeds trends.
rss_community:
  - name: "Simon Willison's Blog"
    url: "https://simonwillison.net/atom/everything/"
  - name: "GitHub Blog"
    url: "https://github.blog/feed/"
  # TODO: verify current feed URLs before enabling —
  # - name: "Anthropic Blog"
  #   url: "https://www.anthropic.com/rss.xml"
  # - name: "Hugging Face Blog"
  #   url: "https://huggingface.co/blog/feed.xml"
  # - name: "Latent Space"
  #   url: "https://www.latent.space/feed"

# Press/journalism — feeds the digest, not the trend radar. These are
# general-tech feeds (not AI-only) because the taxonomy match step already
# filters down to what's AI-relevant — no need to find an AI-specific feed
# per outlet. Verify each URL before enabling; not re-checked today.
rss_news:
  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
  - name: "Wired"
    url: "https://www.wired.com/feed/rss"
  - name: "Ars Technica"
    url: "https://arstechnica.com/feed/"
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
