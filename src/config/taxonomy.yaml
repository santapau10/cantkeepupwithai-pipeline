# The trend dictionary. Every mention count on the radar traces back to a
# match against this file — nothing here is inferred by a model.
#
# To propose a new trend or better aliases: edit this file and open a PR,
# same as a toolbox entry on the main site. `name` and `tag` should match
# what's already seeded on cantkeepupwithai.com where the trend already
# exists there; new trends get picked up on the next ingest run.
#
# Matching is case-insensitive substring matching against post titles
# (see src/taxonomy/match.ts) — keep aliases specific enough to avoid
# false positives (e.g. "agent" alone is too broad; "agent skill" isn't).
#
# Aliases are grouped by register, not just listed flat:
#   dev jargon   -> what HN/Reddit/GitHub titles actually say
#   press phrasing -> softer wording general tech press uses when covering
#                     the same thing, so news-source mentions have a chance
#                     of matching too (they feed the radar directly now —
#                     see README's "Two-pass tagging" section for the
#                     embedding fallback that also helps here)
# We deliberately did NOT add bare company/product names (ChatGPT, OpenAI,
# Anthropic...) as aliases on narrow trends like "Chatbot wrapper startups" —
# that would misattribute unrelated coverage of those companies to a specific
# trend just because the name appears. Aliases stay scoped to what the trend
# actually is.

trends:
  - name: "Agent skills & harnesses"
    tag: technique
    aliases:
      # dev jargon
      - "agent skill"
      - "agent harness"
      - "skill file"
      - "claude skill"
      # press phrasing
      - "ai agent skills"
      - "custom ai agent"
      - "agentic coding tool"
      # Deliberately no bare "coding agent" alias: it matches any general AI
      # coding-agent coverage (product comparisons, launches, cost pieces),
      # not posts specifically about skill/harness architecture.

