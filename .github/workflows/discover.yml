name: Discover new trends

# Runs once a week, every Sunday at 09:00 UTC. Each run costs real
# Anthropic + Voyage API usage. Needs repo secrets set: DATABASE_URL (the
# pipeline's own Neon project), ANTHROPIC_API_KEY, VOYAGE_API_KEY.
#
# `workflow_dispatch` still works for an explicit one-off manual run from the
# GitHub Actions UI/CLI in addition to the weekly schedule.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
