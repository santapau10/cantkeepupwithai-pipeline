name: Daily ingest + tag + sync

# Armed 2026-08-07: runs daily at 08:00 UTC. Repo secrets are set
# (DATABASE_URL, VOYAGE_API_KEY, X_BEARER_TOKEN, WEB_SYNC_URL/
# WEB_SYNC_API_KEY — Reddit's aren't, ingest just skips that source) and the
# full flow was verified end to end locally first. Each run costs real
# Voyage (+ X, pay-per-use) API usage — no Anthropic call on this path,
# only the weekly discover.yml uses that key.
#
# `workflow_dispatch` still works too, for an explicit one-off manual run
# from the GitHub Actions UI/CLI, independent of the schedule.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run dev all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          # Named GITHUB_TOKEN_PAT as the repo secret (not GITHUB_TOKEN) to avoid
          # colliding with the Actions-reserved automatic GITHUB_TOKEN — mapped
          # here to the env var name the pipeline code actually reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_PAT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WEB_SYNC_URL: ${{ secrets.WEB_SYNC_URL }}
          WEB_SYNC_API_KEY: ${{ secrets.WEB_SYNC_API_KEY }}
